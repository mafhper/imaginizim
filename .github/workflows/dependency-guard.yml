name: Dependency Guard

on:
  pull_request:
    paths:
      - 'package.json'
      - 'package-lock.json'
      - '.github/dependabot.yml'
      - '.github/workflows/**'

permissions:
  contents: read
  pull-requests: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.22.1'
          cache: 'npm'

      - name: Install without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Verify npm registry signatures
        run: |
          for attempt in 1 2 3; do
            if npm audit signatures --cache "$RUNNER_TEMP/npm-signatures-cache-$attempt"; then
              exit 0
            fi
            echo "::warning::npm audit signatures failed (attempt $attempt/3); retrying with a fresh cache"
            sleep $((attempt * 10))
          done
          echo "::error::npm audit signatures failed after 3 attempts"
          exit 1

      - name: Audit known vulnerabilities
        run: npm audit --audit-level=high

      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
